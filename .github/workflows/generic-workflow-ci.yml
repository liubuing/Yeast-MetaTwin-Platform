name: generic-workflow

on:
  push:
    paths:
      - "10_generic_target_workflow/**"
      - "tests/**"
      - "08_runtime/**"
      - "04_prediction_plugins/**"
      - "plugin_runtime/**"
      - "requirements-*.txt"
      - ".github/workflows/generic-workflow-ci.yml"
  pull_request:
    paths:
      - "10_generic_target_workflow/**"
      - "tests/**"
      - "08_runtime/**"
      - "04_prediction_plugins/**"
      - "plugin_runtime/**"
      - "requirements-*.txt"
      - ".github/workflows/generic-workflow-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest --collect-only -q
      - run: python -m pytest -q tests
